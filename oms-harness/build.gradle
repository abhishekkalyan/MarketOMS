// Test harness module: injects orders into a running OmsNode and validates responses.
// Depends only on oms-codec (wire format) + Aeron cluster client API.
// Does NOT depend on oms-core or algo-sor — it is a black-box client.
plugins {
    id 'application'
}

application {
    mainClass = 'com.cobain.oms.harness.HarnessLauncher'
    applicationDefaultJvmArgs = [
        '--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED',
        '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
    ]
}

dependencies {
    implementation project(':oms-codec')
    implementation libs.agrona
    implementation libs.aeron.client
    implementation libs.aeron.driver
    implementation libs.aeron.cluster
    implementation libs.aeron.archive
    implementation libs.slf4j.api
    runtimeOnly    libs.logback
}
